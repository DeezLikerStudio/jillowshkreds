<!doctype html>
<html lang="ru"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover"><meta name="theme-color" content="#f4eee5"><title>ДжилоуШкредс</title><link rel="stylesheet" href="style.css"><script src="https://telegram.org/js/telegram-web-app.js"></script><script defer src="game.js"></script></head>
<body><main class="app"><section class="game"><canvas id="game" width="360" height="640" aria-label="Игровое поле"></canvas><div class="hud" aria-label="Счёт и рекорд"><span>СЧЁТ <strong id="score">0</strong></span><span>РЕКОРД <strong id="best">0</strong></span></div><div id="overlay" class="overlay"><div class="card"><div class="logo">✦</div><h1 id="title">ДжилоуШкредс</h1><p id="message">Прыгай всё выше и не падай. Персонаж сам отскакивает от платформ.</p><button id="start">Начать игру</button></div></div></section><div class="mobile-controls"><button data-key="left" aria-label="Влево">←</button><button data-key="right" aria-label="Вправо">→</button><button data-key="shoot" aria-label="Стрелять">●</button></div><p class="hint">Движение: ← → или A / D. Выстрел: пробел, кнопка ● или касание поля.</p><div class="skin-controls"><button id="skin" class="skin-button" type="button" aria-label="Сменить скин. Сейчас: Краджил">Сменить скин <span id="skinName">Краджил</span></button></div></main></body></html>
